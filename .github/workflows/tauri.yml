name: Redes desktop (Tauri)

# Gera o Redes.app e o .dmg do app Tauri (interface local + servidor Python embutido).
#  - push na branch tauri e pull requests: só o artefato do workflow;
#  - tag v* (ex.: v0.3.0) ou execução manual com "versao": publica o GitHub Release.
on:
  push:
    branches: [tauri]
  tags: ["v*"]
  pull_request:
    paths: ["desktop/**", ".github/workflows/tauri.yml"]
  workflow_dispatch:
    inputs:
      versao:
        description: "Versão a publicar (ex.: 0.3.0). Vazio = só gera o artefato."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Ferramentas do pacote
        run: brew install librsvg

      - name: Versão e publicação
        id: v
        env:
          REF: ${{ github.ref }}
          REF_TYPE: ${{ github.ref_type }}
          ENTRADA: ${{ github.event.inputs.versao }}
        run: |
          set -euo pipefail
          config_versao="$(python3 -c 'import json; print(json.load(open("desktop/src-tauri/tauri.conf.json"))["version"])')"
          publicar=false
          versao="$config_versao"
          if [ "$REF_TYPE" = "tag" ]; then
            versao="${REF#refs/tags/v}"; publicar=true
          elif [ -n "${ENTRADA// /}" ]; then
            versao="${ENTRADA//[[:space:]]/}"; versao="${versao#v}"; publicar=true
          fi
          case "$versao" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Versão inválida: $versao" >&2; exit 1 ;;
          esac
          pre=false; case "$versao" in *-*) pre=true ;; esac
          echo "versao=$versao" >> "$GITHUB_OUTPUT"
          echo "publicar=$publicar" >> "$GITHUB_OUTPUT"
          echo "pre=$pre" >> "$GITHUB_OUTPUT"
          echo "Versão $versao (config: $config_versao), publicar: $publicar"

      - name: Ajustar a versão pedida
        env:
          VERSAO: ${{ steps.v.outputs.versao }}
        run: |
          set -euo pipefail
          python3 - "$VERSAO" <<'PY'
          import json, sys
          from pathlib import Path
          versao = sys.argv[1]
          caminho = Path("desktop/src-tauri/tauri.conf.json")
          config = json.loads(caminho.read_text(encoding="utf-8"))
          config["version"] = versao
          caminho.write_text(json.dumps(config, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          caminho = Path("desktop/src-tauri/Cargo.toml")
          texto = caminho.read_text(encoding="utf-8")
          texto = texto.replace('version = "0.3.0"', f'version = "{versao}"', 1)
          caminho.write_text(texto, encoding="utf-8")
          PY

      - name: Dependências
        run: |
          set -euo pipefail
          python3 -m venv .venv-desktop
          .venv-desktop/bin/pip install --upgrade pip
          .venv-desktop/bin/pip install pyinstaller .
          cd desktop && npm install

      - name: Ícones
        run: bash desktop/scripts/gerar-icones.sh

      - name: Sidecar Python
        env:
          PYTHON: ${{ github.workspace }}/.venv-desktop/bin/python
        run: bash desktop/scripts/build-sidecar.sh

      - name: Empacotar Redes.app e .dmg
        env:
          VERSAO: ${{ steps.v.outputs.versao }}
        run: |
          set -euo pipefail
          triple="$(rustc -vV | sed -n 's/^host: //p')"
          cd desktop
          npm run tauri build -- --target "$triple"
          echo "triple=$triple" >> "$GITHUB_ENV"

      - name: Nome do arquivo para o release
        id: pacote
        env:
          VERSAO: ${{ steps.v.outputs.versao }}
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            arm64) arq=arm64; tauri_arq=aarch64 ;;
            x86_64) arq=intel; tauri_arq=x86_64 ;;
            *) arq="$(uname -m)"; tauri_arq="$arq" ;;
          esac
          origem="desktop/src-tauri/target/$triple/release/bundle/dmg/Redes_${VERSAO}_${tauri_arq}.dmg"
          test -f "$origem"
          destino="Redes-${VERSAO}-macOS-${arq}.dmg"
          cp "$origem" "$destino"
          shasum -a 256 "$destino" > "$destino.sha256"
          echo "dmg=$destino" >> "$GITHUB_OUTPUT"
          echo "sha=$destino.sha256" >> "$GITHUB_OUTPUT"
          ls -lh "$destino" "$destino.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: Redes-macOS-Tauri-dmg
          path: |
            Redes-*.dmg
            Redes-*.dmg.sha256
          if-no-files-found: error

      - name: Criar ou atualizar o GitHub Release
        if: steps.v.outputs.publicar == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSAO: ${{ steps.v.outputs.versao }}
          DMG: ${{ steps.pacote.outputs.dmg }}
          PRE: ${{ steps.v.outputs.pre }}
          SHA_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag="v$VERSAO"
          soma="$(cut -d' ' -f1 "$DMG.sha256")"
          cat > notas.md <<NOTAS
          Redes $VERSAO para macOS (app desktop em Tauri, $(uname -m)).

          O app abre a interface local do Redes em uma janela própria; o servidor
          Python vai embutido e nenhum dado sai da máquina.

          SHA-256 de \`$DMG\`:

          \`$soma\`

          O app não é notarizado pela Apple. Na primeira abertura, clique com o
          botão direito em Redes e escolha Abrir.
          NOTAS
          flags=()
          [ "$PRE" = "true" ] && flags+=(--prerelease)
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$DMG" "$DMG.sha256" --clobber
            gh release edit "$tag" --title "Redes $VERSAO" --notes-file notas.md ${flags[@]+"${flags[@]}"}
          else
            gh release create "$tag" "$DMG" "$DMG.sha256" --target "$SHA_COMMIT" --title "Redes $VERSAO" --notes-file notas.md ${flags[@]+"${flags[@]}"}
          fi
          echo "Release: $(gh release view "$tag" --json url -q .url)" >> "$GITHUB_STEP_SUMMARY"
