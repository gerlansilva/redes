[project]
name = "scimatpy"
version = "0.1.0"
description = "Fluxo de análise do SciMAT em Python, com figuras no estilo relimeARS"
requires-python = ">=3.10"
dependencies = ["networkx>=3.0", "numpy>=1.24"]

[project.scripts]
scimatpy = "scimatpy.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["scimatpy*"]

[tool.setuptools.package-data]
scimatpy = ["ui/*.html", "ui/*.css", "ui/*.js", "ui/*.svg", "assets/*"]
