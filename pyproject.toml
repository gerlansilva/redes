[project]
name = "redes"
version = "0.1.0"
description = "Redes: mapeamento científico (bibliometria) inspirado no SciMAT, com interface web local em português"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Gerlan Silva da Silva" }]
keywords = ["bibliometria", "cientometria", "mapeamento científico", "SciMAT", "Scopus", "análise de redes"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Natural Language :: Portuguese (Brazilian)",
]
dependencies = ["networkx>=3.0", "numpy>=1.24"]

[project.optional-dependencies]
# Só para os testes de interface (pulam sozinhos quando o Playwright não está instalado).
teste = ["playwright>=1.40"]

[project.urls]
ORCID = "https://orcid.org/0000-0002-9996-9983"

[project.scripts]
redes = "redes.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["redes*"]

[tool.setuptools.package-data]
redes = ["ui/*.html", "ui/*.css", "ui/*.js", "ui/*.svg", "assets/*"]
