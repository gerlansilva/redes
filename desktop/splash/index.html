<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redes</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #F7F8FC; color: #0B1F66;
      font: 15px/1.5 -apple-system, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      -webkit-user-select: none; user-select: none;
    }
    main { display: grid; justify-items: center; gap: 14px; padding: 32px; text-align: center; }
    img { width: 132px; height: 132px; }
    h1 { margin: 0; font-size: 22px; letter-spacing: -.02em; }
    p { margin: 0; color: #5A6478; font-size: 13px; }
    .erro { max-width: 460px; color: #8A2B2B; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <img src="logo.png" alt="">
    <h1>Redes</h1>
    <p id="status">Abrindo o servidor local…</p>
    <p class="erro" id="erro" hidden>
      Não foi possível abrir o servidor local. Feche o app e abra de novo;
      se continuar, verifique se a pasta <code>~/redes-projetos</code> existe.
    </p>
  </main>
</body>
</html>
