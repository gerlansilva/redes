[package]
name = "redes-desktop"
version = "0.3.0"
edition = "2021"
description = "Redes para macOS: aplicativo desktop sobre a interface web local"
license = "GPL-3.0-or-later"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
