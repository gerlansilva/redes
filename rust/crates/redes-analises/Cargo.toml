[package]
name = "redes-analises"
version = "0.1.0"
edition = "2021"
description = "Redes: análises avançadas (dendrograma, linha do tempo e rajadas, densidade, similitude, duplo mapa, fluxo Sankey, bibliometria) com dados serializáveis e SVG"
license = "MIT"

[lib]
name = "redes_analises"
path = "src/lib.rs"

[dependencies]
redes-core = { path = "../redes-core" }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = { version = "2", features = ["serde"] }
unicode-normalization = "0.1"
regex = { version = "1", default-features = false, features = ["std", "unicode-perl", "unicode-case", "unicode-gencat", "perf"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[dev-dependencies]
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
