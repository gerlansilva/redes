[package]
name = "redes-importa"
version = "0.1.0"
edition = "2021"
description = "Redes: importação de exportações bibliográficas (Scopus, WoS, OpenAlex, RIS, BibTeX, CSV, Zotero) para projetos .redes"
license = "MIT"

[lib]
name = "redes_importa"
path = "src/lib.rs"

[[bin]]
name = "redes-importa-cli"
path = "src/bin/redes-importa-cli.rs"

[dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
indexmap = { version = "2", features = ["serde"] }
unicode-normalization = "0.1"
fancy-regex = "0.14"
csv = "1"

[dev-dependencies]
redes-core = { path = "../redes-core" }
tempfile = "3"
