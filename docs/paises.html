<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<title>Redes — países do SERJ</title>
<style>
  :root { --azul:#2F2BFF; --roxo:#6A3BFF; --tinta:#0B1F66; --fraco:#64748B; --fundo:#F7F8FB; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--fundo); color:var(--tinta);
         font-family: Helvetica, Arial, sans-serif; }
  header { padding:28px 32px 18px; }
  h1 { margin:0 0 6px; font-size:24px; font-weight:600; letter-spacing:-.01em; }
  header p { margin:0; color:var(--fraco); font-size:14px; }
  figure { margin:0 0 34px; }
  figure img { width:100%; display:block; border-radius:14px; }
  main { padding:0 24px 40px; max-width:1240px; margin:0 auto; }
  figcaption { margin:10px 8px 0; color:var(--fraco); font-size:13px; }
</style>

<header>
  <h1>Países — SERJ</h1>
  <p>281 documentos, 46 países, 60 cooperações, 17,4% de coautoria internacional.</p>
</header>

<main>
  <figure>
    <img src="mapa-serj.svg" alt="Mapa de colaboração entre países">
    <figcaption>Mapa: posição geográfica; área da esfera pelo número de documentos. Na ferramenta, o mapa é interativo: passar o mouse mostra documentos e parceiros, clicar destaca o país e suas cooperações.</figcaption>
  </figure>

  <figure>
    <img src="rede-paises-serj.svg" alt="Rede de colaboração entre países">
    <figcaption>Rede no padrão das demais: halo por agrupamento, selo numerado na borda e legenda à direita.</figcaption>
  </figure>
</main>
</html>
